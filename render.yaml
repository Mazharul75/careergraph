# Render Blueprint — infrastructure as code.
#
# Committing this rather than clicking through a dashboard means the deployment is reviewable,
# diffable, and reproducible. Someone reading the repository can see exactly what runs in
# production without being given access to an account.
#
# Apply it from the Render dashboard: New → Blueprint → connect this repository.

services:
  - type: web
    name: careergraph-api
    runtime: docker
    plan: free
    region: singapore # closest free region to Bangladesh
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Deploys are triggered by the CD workflow *after* CI passes, not by Render watching the
    # branch. Render's own auto-deploy would ship whatever landed on main even if the tests
    # were red — which defeats the point of having a pipeline.
    autoDeploy: false

    # A single bare token, deliberately. An earlier version inlined
    # `sh -c "alembic upgrade head && uvicorn ..."` here and failed with exit 127: Render runs
    # dockerCommand through its own shell, so the extra sh -c wrapper meant the whole quoted
    # string reached the container as one command name. Anything containing quotes, &&, or
    # variables is at the mercy of two layers of parsing; a script path is at the mercy of none.
    #
    # The script applies migrations, then execs uvicorn. Migrations run on start rather than as
    # a pre-deploy step because preDeployCommand is a paid feature; `alembic upgrade head` is
    # idempotent, so running it on every boot is a no-op once the database is at head.
    #
    # See backend/start.sh.
    dockerCommand: /app/start.sh

    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # sync: false means "prompt me for this in the dashboard and never store it in git".
      # These are the only two secrets in the system.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false

      - key: CORS_ORIGINS
        sync: false # the Vercel URL, known only after the frontend is deployed

      # Celery broker. Render Key Value is available on the free tier — create one in the
      # dashboard and paste its internal connection string here.
      #
      # There is no separate worker service in this file, and that is deliberate: Render's
      # free tier does not offer Background Workers, so start.sh runs the API and the worker
      # as two processes in this one instance via honcho. See ADR-0008 — splitting them out
      # later means adding a `type: worker` service here, not changing any application code.
      - key: REDIS_URL
        sync: false

      # Optional: paste a Sentry DSN to enable error tracking, or leave blank to run
      # without it. The application treats an empty value as "Sentry off".
      - key: SENTRY_DSN
        sync: false

      - key: CELERY_CONCURRENCY
        value: "1"
      # Recycle the worker child after every task. The embedding model is ~200 MB resident
      # (ADR-0009) and process exit is the only thing that reliably returns it to the OS; a
      # higher value keeps it alongside the API on a 512 MB instance until something is killed.
      - key: CELERY_MAX_TASKS_PER_CHILD
        value: "1"
      - key: MAX_UPLOAD_BYTES
        value: "5242880"

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

      # Neon's free tier caps connections, and the free Render instance is single-process.
      # A large pool here would exhaust the database's limit before the API ever saturates.
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"

# Local development stack. `docker compose up` from the repository root.
#
# Postgres and Redis publish their ports to the host so you can run pytest, psql, or the API
# directly on your machine against the same containers.

name: careergraph

services:
  db:
    # pgvector's own image: PostgreSQL 16 with the vector extension already compiled in.
    # Building pgvector from source on Windows is genuinely painful; this sidesteps it.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careergraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careergraph_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-careergraph}
    ports:
      # Host port 5433, not 5432. A natively installed PostgreSQL commonly already owns 5432,
      # and the failure mode is nasty: Docker still starts, but connections to `localhost`
      # silently reach the *other* server and fail with "password authentication failed" —
      # which reads like a credentials bug rather than a port collision.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run once, on first initialisation of an empty data volume.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Without this, `depends_on` only waits for the container to *start*, not for Postgres
      # to accept connections — so the API races ahead and crashes on first query.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careergraph} -d ${POSTGRES_DB:-careergraph}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Not used until Phase 2 (Celery broker). Declared now so the local stack matches the
    # deployed topology and Phase 2 needs no infrastructure change.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Inside the compose network, services reach each other by service name — `db`, not
      # localhost. This is why the URL differs from the one in .env used for host-side pytest.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-careergraph}:${POSTGRES_PASSWORD:-careergraph_local_dev_only}@db:5432/${POSTGRES_DB:-careergraph}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Deliberately has no compose-level fallback. A missing JWT_SECRET_KEY must fail loudly
      # at startup; a default here would let a real deployment inherit a shared, guessable key
      # without anyone noticing.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env — copy it from .env.example}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind-mount the source for hot reload in development. The image still contains a full
      # copy, so the deployed container does not depend on this mount existing.
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      # Operational scripts (promote_admin, load_test). Mounted as well as baked into the
      # image so editing one does not need a rebuild -- the image copy is what production
      # uses, this mount is purely a development convenience.
      - ./backend/scripts:/app/scripts:ro
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    # Locally the worker runs as its own container, which is the architecture ADR-0008
    # describes and the shape we would deploy on a paid plan. Colocating it with the API via
    # honcho is a free-tier hosting workaround, not the design — so local development mirrors
    # the intended topology, and the code is identical either way.
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-careergraph}:${POSTGRES_PASSWORD:-careergraph_local_dev_only}@db:5432/${POSTGRES_DB:-careergraph}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env — copy it from .env.example}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for the API container, which is what applies migrations. A worker that starts
      # first would connect to a database with no `resumes` table.
      api:
        condition: service_started
    volumes:
      - ./backend/app:/app/app:ro
    command:
      - /app/.venv/bin/celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=1
      - --without-gossip
      - --without-mingle
      # Embedded celery beat: schedules the maintenance sweepers from inside the worker
      # process. Correct only while there is exactly one worker instance.
      - -B

volumes:
  postgres_data:
  redis_data:

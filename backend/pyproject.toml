[project]
name = "careergraph-backend"
version = "0.1.0"
description = "CareerGraph API and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    # `email` extra pulls in email-validator, backing Pydantic's EmailStr.
    "pydantic[email]>=2.10.4",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Argon2id password hashing. Used directly rather than through passlib, which has had no
    # release since 2020 and breaks against modern bcrypt.
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.1",
    # --- Phase 2a: async pipeline ---
    "celery[redis]>=5.4.0",
    # Sync Postgres driver for the Celery worker. Celery has no event loop, so it cannot use
    # the asyncpg engine the API uses — see ADR-0005.
    "psycopg[binary]>=3.2.3",
    # FastAPI needs this to parse multipart/form-data file uploads.
    "python-multipart>=0.0.20",
    # Text extraction. Both are pure-Python and small; nothing here pulls in a native toolchain.
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    # Runs the API and the Celery worker as two processes in one container — see ADR-0008.
    "honcho>=2.0.0",
    # --- Phase 2c: semantic matching ---
    # fastembed runs sentence-transformer models through ONNX Runtime instead of PyTorch:
    # roughly a tenth the footprint, which is what makes it fit on a 512 MB instance
    # alongside the API and the worker. See ADR-0009.
    "fastembed>=0.5.0",
    # SQLAlchemy type for pgvector's `vector` column.
    "pgvector>=0.3.6",
    # --- Phase 3: skill graph ---
    # In-process graph algorithms. See ADR-0002 for why not Neo4j.
    "networkx>=3.4",
    "structlog>=26.1.0",
    "sentry-sdk[fastapi]>=2.68.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "psutil>=7.2.2",
    "types-networkx>=3.6.1.20260728",
]

[tool.uv]
# This is an application, not a distributable library, so there is nothing to build.
# `pythonpath` in the pytest config below is what makes `import app` resolve.
package = false

# --------------------------------------------------------------------------------------
# Ruff — linter and formatter. Replaces flake8 + isort + black with one fast tool.
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes — undefined names, unused imports
    "I",    # isort — import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade — modern syntax
    "B",    # flake8-bugbear — likely bugs
    "C4",   # comprehension simplifications
    "SIM",  # simplifications
    "S",    # flake8-bandit — security lints
    "ASYNC",# async-specific footguns (blocking calls in async defs)
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # function call in default arg — this is exactly how FastAPI's Depends() works
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts (S101) and hardcoded dummy passwords (S105/S106).
"tests/**" = ["S101", "S105", "S106"]
# Migrations are partly generated and keep Alembic's own conventions.
"alembic/versions/*" = ["E501", "I001"]
# The seed vocabulary is a data table inside a `# fmt: off` block, so the formatter leaves it
# alone by design — one skill per line reads far better than wrapped tuples.
"app/data/skills_seed.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Without this, ruff sees the `alembic/` directory in the project root and classifies the
# installed `alembic` package as first-party, so it demands an import order that contradicts
# the one it would enforce anywhere else.
known-third-party = ["alembic"]

# --------------------------------------------------------------------------------------
# Mypy — static type checking.
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = []
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
# Test fakes stand in for Protocols, and a Protocol gaining a method must fail type-checking
# rather than surfacing as an AttributeError at runtime — which is exactly what happened when
# TaskDispatcher gained enqueue_job_embedding. Relaxed on untyped defs because test bodies are
# self-evident and annotating every assertion adds noise without adding safety.
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Celery ships no type stubs and no py.typed marker. Silencing the import error is honest here
# — the alternative is a `# type: ignore` on every celery import, which is noisier and easier
# to leave behind once stubs eventually exist.
module = ["celery.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Both scopes must be "session". The database engine is a session-scoped fixture, and an
# asyncpg connection is bound to the event loop that created it. With function-scoped tests,
# every test gets a fresh loop and inherits a connection from a different one — which fails
# with "got Future attached to a different loop". Sharing one loop for the whole session is
# what makes a session-scoped engine legal.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: touches a real database or the HTTP layer",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
